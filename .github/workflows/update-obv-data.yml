name: Update OBV data

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-obv-data.yml"
      - "requirements.txt"
      - "scripts/fetch_obv_bsc70.py"
  schedule:
    # GitHub cron runs in UTC. These two slots plus the guard below produce
    # one effective run at 05:00 Europe/Vienna across standard time and DST.
    - cron: "0 3 * * *"
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-obv-data
  cancel-in-progress: false

jobs:
  update-obv-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check schedule time
        id: schedule_time
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run_scrape=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$(TZ=Europe/Vienna date +%H)" != "05" ]; then
            echo "Not 05:00 Europe/Vienna; skipping this UTC cron slot."
            echo "run_scrape=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run_scrape=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.schedule_time.outputs.run_scrape == 'true'
        uses: actions/checkout@v7

      - name: Set up Python
        if: steps.schedule_time.outputs.run_scrape == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        if: steps.schedule_time.outputs.run_scrape == 'true'
        run: python -m pip install -r requirements.txt

      - name: Fetch OBV data
        if: steps.schedule_time.outputs.run_scrape == 'true'
        run: python scripts/fetch_obv_bsc70.py --output data/bsc70-teams.json

      - name: Commit updated data
        if: steps.schedule_time.outputs.run_scrape == 'true'
        shell: bash
        run: |
          if git diff --quiet -- data/bsc70-teams.json; then
            echo "OBV data unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bsc70-teams.json
          git commit -m "Update OBV team data"
          git push
