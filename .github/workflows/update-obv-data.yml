name: Update OBV data

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-obv-data.yml"
      - "requirements.txt"
      - "scripts/fetch_obv_bsc70.py"
  schedule:
    # Schedule once at 05:00 local time, including daylight saving changes.
    # Always process delayed runs: GitHub does not guarantee the start time.
    - cron: "0 5 * * *"
      timezone: "Europe/Vienna"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-obv-data
  cancel-in-progress: false

jobs:
  update-obv-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch OBV data
        run: python scripts/fetch_obv_bsc70.py --output data/bsc70-teams.json

      - name: Commit updated data
        shell: bash
        run: |
          if git diff --quiet -- data/bsc70-teams.json; then
            echo "OBV data unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bsc70-teams.json
          git commit -m "Update OBV team data"
          git push
